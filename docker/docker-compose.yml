version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - ORCA_DATA_MODE=DEMO
    volumes:
      - ../data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
